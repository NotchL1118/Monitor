name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Test and build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          node --version
          test "$(uname -m)" = "$EXPECTED_ARCH"
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}

      - name: Run Swift and extension tests
        run: ./scripts/test.sh

      - name: Build, sign and package app
        run: ./scripts/package-release.sh
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          EXPECTED_ARCH: ${{ matrix.arch }}

      - name: Upload app archive
        uses: actions/upload-artifact@v7
        with:
          name: Monitor-macos-${{ matrix.arch }}
          path: |
            dist/release/*.zip
            dist/release/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.arch }}
          path: .build/qa/*.png
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: Monitor-macos-*
          path: dist/release
          merge-multiple: true

      - name: Verify both app archives
        working-directory: dist/release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for arch in arm64 x86_64; do
            archive="Monitor-${RELEASE_TAG#v}-macos-${arch}.zip"
            test -s "$archive"
            sha256sum --check "$archive.sha256"
          done
          cat ./*.zip.sha256 > SHA256SUMS.txt

      - name: Publish release with downloadable apps
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$draft" == false ]]; then
              echo "Release $RELEASE_TAG is already published; leaving its assets unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Monitor $RELEASE_TAG" --generate-notes \
              --notes-file .github/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" dist/release/*.zip dist/release/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
